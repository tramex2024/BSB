<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de TradingView</title>
    <style>
        body { 
            background: #111827; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        h2 { margin-bottom: 10px; }
        #test-container { 
            width: 800px; 
            height: 500px; 
            border: 2px solid #10b981; 
            border-radius: 8px; 
        }
    </style>
</head>
<body>
    <h2>Test de Widget TradingView (BITMART:BTCUSDT)</h2>
    <div id="test-container"></div>

    <!-- Script oficial de TradingView -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "width": "100%",
            "height": "100%",
            "symbol": "BINANCE:BTCUSDT",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "es",
            "toolbar_bg": "#111827",
            "enable_publishing": false,
            "container_id": "test-container"
        });
    </script>
</body>
</html>
